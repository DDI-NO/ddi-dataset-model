      included_via_display_version: "dump"
    label: "Label"
    definition: "Label identifying the CSF biochemistry record."
    source:
      schema_element: "csf:CSFData.ID"
      display_field_elements:
        Field1: "csf:CSFData.ID"
        Field2: "csf:CSFData.label"
    derivation:
      kind: "sql"
      input: "COALESCE(@Field2, @Field1)"
      mapping: {}
      else: null
      depends_on_display_fields: []
    semantics:
      level: "visit"
      domain: "csf"
      value_type: "text"
      units: null
      preferred_representation: "raw"
    resolution:
      canonical_name: "label"
      synonyms:
        - "Label"
        - "label"
        - "LABEL"
