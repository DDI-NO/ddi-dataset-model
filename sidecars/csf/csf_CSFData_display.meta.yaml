    label: "A hierarchical"
    definition: "Derived amyloid classification based on the hierarchical biomarker rule."
    source:
      schema_element: "csf:CSFData/MSD_AB_42/mean"
      display_field_elements:
        amypet_conclu: "view:AMYPET_CSF.amypet_conclu"
        msd_ab_42_mean: "csf:CSFData/MSD_AB_42/mean"
        msd_ab_40_mean: "csf:CSFData/MSD_AB_40/mean"
