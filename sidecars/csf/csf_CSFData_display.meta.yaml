        expdate: "csf:CSFData/date"
        subject_label: "xnat:subjectData/label"
    derivation:
      kind: "sql_case"
      input: |-
        COALESCE(case when @amypet_conclu = 0 or @amypet_conclu = 1 then @amypet_conclu end,
        				 case when @msd_ab_42_mean/@msd_ab_40_mean <= 0.0774 then 1 when @msd_ab_42_mean/@msd_ab_40_mean is null then null else 0 end,
        				 (CASE WHEN @csf_abeta42 < abeta_cutoff(@subject_label, @expdate) then 1  when @csf_abeta42 is null then null else 0 end))
      mapping:
        "@amypet_conclu = 0 or @amypet_conclu = 1": "@amypet_conclu"
        "@msd_ab_42_mean/@msd_ab_40_mean <= 0.0774": "1"
        "@csf_abeta42 < abeta_cutoff(@subject_label, @expdate)": "1"
