      display_field_elements:
        Field1: "bioch:BiochemistryData.ID"
        Field2: "bioch:BiochemistryData.label"
    derivation:
      kind: "sql"
      input: "COALESCE(@Field2, @Field1)"
      mapping: {}
      else: null
