  cs_status:
    export:
      column: null
      included_via_display_version: "dump"
    label: "Cognitive Screening status"
    definition: "Indicates the cognitive screening status of the participant based on regression-adjusted T-scores for CERAD Recall, TMTB, COWAT, and VOSP Total. A value of 0 indicates impaired cognitive screening status (T-score < 36), a value of 1 indicates normal cognitive screening status (T-score > 35), and a value of NULL indicates indeterminate cognitive screening status."
    source:
      schema_element: "cs:cogScrData.date"
      display_field_elements:
        Field1: "view:CS_COGSCRDATA_CERAD.CERAD_Recall"
        cs_date: "cs:cogScrData.date"
        dob: "xnat:demographicData.dob"
        yob: "xnat:demographicData.yob"
        Field3: "view:CS_DEMOGRAPHICS.gender"
        edu: "view:CS_DEMOGRAPHICS.edu_years"
        tmtb: "view:CS_TSCORES.TMTB_Tscore"
        raw: "view:CS_COGSCRDATA_TMT.TMTB_Sec"
        vosp: "view:CS_COGSCRDATA_VOSP.VOSP_Total"
        cowat: "view:CS_COGSCRDATA_COWAT.COWAT_Total"
        failed_b: "view:CS_COGSCRDATA_TMT.TMTB_Failed"
    derivation:
      kind: "sql_case"
      input: |-
        CASE WHEN cerad_recall_regr_t_score(@Field1::int,CAST(COALESCE(FLOOR(CAST((CAST(((@cs_date) - (@dob))AS FLOAT4)/365) AS numeric)),FLOOR((EXTRACT(YEAR FROM @cs_date)) - (@yob))) AS numeric)::int, @Field3, @edu ) < 36 or tmt_b_regr_t_score(@raw, CAST(COALESCE(FLOOR(CAST((CAST(((@cs_date) - (@dob))AS FLOAT4)/365) AS numeric)),FLOOR((EXTRACT(YEAR FROM @cs_date)) - (@yob))) AS numeric)::int, @edu, @failed_b) < 36
        					or cowat_regr_t_score(@cowat, @edu) < 36 or vosp_regr_t_score(@vosp::int,CAST(COALESCE(FLOOR(CAST((CAST(((@cs_date) - (@dob))AS FLOAT4)/365) AS numeric)),FLOOR((EXTRACT(YEAR FROM @cs_date)) - (@yob))) AS numeric)::int) < 36 THEN 0
        
        					WHEN cerad_recall_regr_t_score(@Field1::int,CAST(COALESCE(FLOOR(CAST((CAST(((@cs_date) - (@dob))AS FLOAT4)/365) AS numeric)),FLOOR((EXTRACT(YEAR FROM @cs_date)) - (@yob))) AS numeric)::int, @Field3, @edu ) > 35 or tmt_b_regr_t_score(@raw, CAST(COALESCE(FLOOR(CAST((CAST(((@cs_date) - (@dob))AS FLOAT4)/365) AS numeric)),FLOOR((EXTRACT(YEAR FROM @cs_date)) - (@yob))) AS numeric)::int, @edu, @failed_b) > 35
        					or cowat_regr_t_score(@cowat, @edu) > 35 or vosp_regr_t_score(@vosp::int,CAST(COALESCE(FLOOR(CAST((CAST(((@cs_date) - (@dob))AS FLOAT4)/365) AS numeric)),FLOOR((EXTRACT(YEAR FROM @cs_date)) - (@yob))) AS numeric)::int) > 35 THEN 1 
        					
        					ELSE NULL END
      mapping: {}
      else: null
      depends_on_display_fields: []
