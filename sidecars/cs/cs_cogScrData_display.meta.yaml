  CERAD_recog_DDI_percentile:
    export:
      column: null
      included_via_display_version: "dump"
    label: "CERAD Recognition DDI percentile"
    definition: "Percentile score for CERAD Recognition in the DDI cohort."
    source:
      schema_element: "cs:cogScrData.date"
      display_field_elements:
        Field1: "view:CS_COGSCRDATA_CERAD.CERAD_Recog"
        cs_date: "cs:cogScrData.date"
        dob: "xnat:demographicData.dob"
        yob: "xnat:demographicData.yob"
        Field3: "view:CS_DEMOGRAPHICS.gender"
        Field4: "view:CS_DEMOGRAPHICS.edu_years"
        Field5: "cs:cogScrData.date"
    derivation:
      kind: "sql_case"
      input: |-
        cerad_recog_ddi_percentile(@Field1::int, CAST(COALESCE(FLOOR(CAST((CAST(((@cs_date) - (@dob))AS FLOAT4)/365) AS numeric)),FLOOR((EXTRACT(YEAR FROM @cs_date)) - (@yob))) AS numeric)::int, CASE @Field3
        					WHEN 'male'::text THEN 'M'::text
        					WHEN 'female'::text THEN 'F'::text
        					ELSE 'U'::text
        					END)
      mapping:
        "'male'::text": "M"
        "'female'::text": "F"
      else: "U"
      depends_on_display_fields: []
    semantics:
      level: "visit"
      domain: "cs"
      value_type: "categorical"
      units: null
      preferred_representation: "raw"
    resolution:
      canonical_name: "cerad_recog_ddi_percentile"
      synonyms:
        - "CERAD Recognition DDI percentile"
        - "cerad recognition ddi percentile"
        - "CERAD_recog_DDI_percentile"
        - "cerad_recog_ddi_percentile"
    allowed_values:
      - "M"
      - "F"
      - "U"
    sensitivity: "none"
    quality:
      notes: null
