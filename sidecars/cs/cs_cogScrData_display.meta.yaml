        Field5: "cs:cogScrData.date"
    derivation:
      kind: "sql_case"
      input: |-
        cerad_learning_regr_t_score(@cerad_learning::int, CAST(COALESCE(FLOOR(CAST((CAST(((@cs_date) - (@dob))AS FLOAT4)/365) AS numeric)),FLOOR((EXTRACT(YEAR FROM @cs_date)) - (@yob))) AS numeric)::int, CASE @gender
