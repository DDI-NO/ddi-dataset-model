  SUBJ_GROUP_TEXT:
    export:
      column: null
      included_via_display_version: "dump"
    label: "Subject group text"
    definition: "Label representation of group classification assigned to the participant, derived from coded values."
    source:
      schema_element: "dem:ddiDemographicData/subj_group"
      display_field_elements:
        Field1: "dem:ddiDemographicData/subj_group"
    derivation:
      kind: "sql_case"
      input: |-
        CASE @Field1
                when 0 then 'Cognitive symptom group'
                when 1 then 'Parkinsonism symptom group'
                when 2 then 'Spouse control group'
                when 3 then 'Ordinary control group'
                when 4 then 'Orthopedic control group'
                when 5 then 'Family history "control" group'
                when 6 then 'Cognitive symptom - extension from previous study group'
                when 7 then 'Neuropsychiatric symptoms group'
                when 8 then 'Skogholts disease'
              	ELSE NULL
              END
      mapping:
        "0": "Cognitive symptom group"
        "1": "Parkinsonism symptom group"
        "2": "Spouse control group"
        "3": "Ordinary control group"
        "4": "Orthopedic control group"
        "5": "Family history \"control\" group"
        "6": "Cognitive symptom - extension from previous study group"
        "7": "Neuropsychiatric symptoms group"
        "8": "Skogholts disease"
      else: null
      depends_on_display_fields: []
    semantics:
      level: "visit"
      domain: "dem"
      value_type: "categorical"
      units: null
      preferred_representation: "raw"
    resolution:
      canonical_name: "subj_group_text"
      synonyms:
        - "Subject group text"
        - "subject group text"
        - "SUBJ_GROUP_TEXT"
        - "subj_group_text"
    allowed_values:
      - "Cognitive symptom group"
      - "Parkinsonism symptom group"
      - "Spouse control group"
      - "Ordinary control group"
      - "Orthopedic control group"
      - "Family history \"control\" group"
      - "Cognitive symptom - extension from previous study group"
      - "Neuropsychiatric symptoms group"
      - "Skogholts disease"
    sensitivity: "none"
    quality:
      notes: null
