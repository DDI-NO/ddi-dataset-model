        Field2: "xnat:demographicData.dob"
        Field3: "xnat:demographicData.yob"
    derivation:
      kind: "sql"
      input: |-
        CAST(COALESCE(FLOOR(CAST((CAST(((@Field1) - (@Field2))AS FLOAT4)/365) AS
