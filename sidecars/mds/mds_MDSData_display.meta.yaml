    export:
      column: null
      included_via_display_version: "dump"
    label: "Label"
    definition: "Label identifying the MDS assessment record."
    source:
      schema_element: "mds:MDSData.ID"
      display_field_elements:
        Field1: "mds:MDSData.ID"
        Field2: "mds:MDSData.label"
    derivation:
      kind: "sql"
      input: "COALESCE(@Field2, @Field1)"
      mapping: {}
      else: null
      depends_on_display_fields: []
    semantics:
      level: "visit"
      domain: "mds"
      value_type: "text"
      units: null
      preferred_representation: "raw"
    resolution:
